name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  repository:
    name: Repository checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      frontend: ${{ steps.detect.outputs.frontend }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate GitHub Actions workflows
        uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -color
      - name: Check whitespace in changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -n "$BASE_SHA" ] && ! [[ "$BASE_SHA" =~ ^0+$ ]]; then
            git diff --check "$BASE_SHA" HEAD
          else
            git show --format= --check HEAD
          fi
      - name: Detect project components
        id: detect
        run: |
          frontend=false
          if [ -f frontend/package.json ]; then
            if [ ! -f frontend/package-lock.json ]; then
              echo "::error::Commit frontend/package-lock.json so npm ci is reproducible."
              exit 1
            fi
            frontend=true
          fi
          if [ -d frontend ] && [ "$frontend" = false ] && [ -n "$(find frontend -type f ! -name README.md ! -name .gitkeep -print -quit)" ]; then
            echo "::error::Frontend files exist without frontend/package.json."
            exit 1
          fi
          test -f backend/pyproject.toml
          test -f backend/uv.lock
          echo "frontend=$frontend" >> "$GITHUB_OUTPUT"
          {
            echo "## Project components"
            echo "- React/TypeScript detected: $frontend"
            echo "- FastAPI backend: required"
            if [ "$frontend" = false ]; then
              echo ""
              echo "Frontend is absent and skipped. API integration with a browser is not verified. See .github/CI.md."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  frontend:
    name: Frontend checks
    needs: repository
    if: needs.repository.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:ci
      - run: npm run build

  backend:
    name: Backend checks
    needs: repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    env:
      HF_DATABASE_URL: postgresql+psycopg://honeyforge:ci-only@127.0.0.1:5432/honeyforge_test
      HF_TEST_DATABASE_URL: postgresql+psycopg://honeyforge:ci-only@127.0.0.1:5432/honeyforge_test
      HF_SESSION_SECRET: ci-only-session-secret-not-for-production-00000000
      HF_CREDENTIAL_KEY: MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA=
      HF_ENVIRONMENT: test
      HF_COOKIE_SECURE: 'false'
      HF_ALLOWED_ORIGINS: '["http://localhost:5173"]'
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: honeyforge_test
          POSTGRES_USER: honeyforge
          POSTGRES_PASSWORD: ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U honeyforge -d honeyforge_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install locked dependencies
        run: |
          python -m pip install uv==0.11.28
          uv sync --frozen
      - name: Lint and formatting
        run: |
          uv run --frozen ruff check . ../scripts
          uv run --frozen ruff format --check . ../scripts
      - name: Type checking
        run: uv run --frozen mypy
      - name: Migration upgrade, downgrade and model consistency
        run: |
          uv run --frozen alembic upgrade head
          uv run --frozen alembic check
          uv run --frozen alembic downgrade base
          uv run --frozen alembic upgrade head
      - name: Verify generated OpenAPI
        run: uv run --frozen python -m honeyforge.cli export-openapi --check
      - name: Integration and contract tests on PostgreSQL
        run: uv run --frozen pytest --junitxml=test-results.xml
      - name: Build runtime image
        run: docker build --tag honeyforge-control:ci .

  result:
    name: CI result
    needs: [repository, frontend, backend]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Verify all required checks passed
        env:
          REPOSITORY_RESULT: ${{ needs.repository.result }}
          BACKEND_RESULT: ${{ needs.backend.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          FRONTEND_PRESENT: ${{ needs.repository.outputs.frontend }}
        run: |
          test "$REPOSITORY_RESULT" = success
          test "$BACKEND_RESULT" = success
          if [ "$FRONTEND_PRESENT" = true ]; then
            test "$FRONTEND_RESULT" = success
          elif [ "$FRONTEND_PRESENT" = false ]; then
            test "$FRONTEND_RESULT" = skipped
          else
            echo "::error::Component detection did not complete."
            exit 1
          fi
          echo "All required CI checks passed."
