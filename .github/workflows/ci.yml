name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  repository:
    name: Repository checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      frontend: ${{ steps.detect.outputs.frontend }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate GitHub Actions workflows
        # Закреплённый выпуск и SHA-256; проверка не зависит от лимитов Docker Hub.
        run: |
          actionlint_archive="$RUNNER_TEMP/actionlint.tar.gz"
          mkdir -p "$RUNNER_TEMP/actionlint"
          curl --fail --location --retry 3 --retry-delay 2 \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            --output "$actionlint_archive"
          printf '%s  %s\n' '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8' "$actionlint_archive" | sha256sum --check --status
          tar -xzf "$actionlint_archive" -C "$RUNNER_TEMP/actionlint" actionlint
          "$RUNNER_TEMP/actionlint/actionlint" -color
      - name: Check whitespace in changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -n "$BASE_SHA" ] && ! [[ "$BASE_SHA" =~ ^0+$ ]]; then
            git diff --check "$BASE_SHA" HEAD
          else
            git show --format= --check HEAD
          fi
      - name: Detect project components
        id: detect
        run: |
          frontend=false
          if [ -f frontend/package.json ]; then
            if [ ! -f frontend/package-lock.json ]; then
              echo "::error::Commit frontend/package-lock.json so npm ci is reproducible."
              exit 1
            fi
            frontend=true
          fi
          if [ -d frontend ] && [ "$frontend" = false ] && [ -n "$(find frontend -type f ! -name README.md ! -name .gitkeep -print -quit)" ]; then
            echo "::error::Frontend files exist without frontend/package.json."
            exit 1
          fi
          test -f backend/pyproject.toml
          test -f backend/uv.lock
          echo "frontend=$frontend" >> "$GITHUB_OUTPUT"
          {
            echo "## Project components"
            echo "- React/TypeScript detected: $frontend"
            echo "- FastAPI backend: required"
            if [ "$frontend" = false ]; then
              echo ""
              echo "Frontend is absent and skipped. API integration with a browser is not verified. See .github/CI.md."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  frontend:
    name: Frontend checks
    needs: repository
    if: needs.repository.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:ci
      - run: npm run build

  e2e:
    name: Frontend E2E (Chromium, MSW)
    needs: repository
    if: needs.repository.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    env:
      PW_CHANNEL: chromium
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - name: Upload browser diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7

  backend:
    name: Backend checks
    needs: repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    env:
      HF_DATABASE_URL: postgresql+psycopg://honeyforge:ci-only@127.0.0.1:5432/honeyforge_test
      HF_TEST_DATABASE_URL: postgresql+psycopg://honeyforge:ci-only@127.0.0.1:5432/honeyforge_test
      HF_SESSION_SECRET: ci-only-session-secret-not-for-production-00000000
      HF_CREDENTIAL_KEY: MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA=
      HF_ENVIRONMENT: test
      HF_COOKIE_SECURE: 'false'
      HF_ALLOWED_ORIGINS: '["http://localhost:5173"]'
    services:
      postgres:
        # Тот же PostgreSQL 17 из официального зеркала Docker; digest закреплён.
        image: public.ecr.aws/docker/library/postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
        env:
          POSTGRES_DB: honeyforge_test
          POSTGRES_USER: honeyforge
          POSTGRES_PASSWORD: ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U honeyforge -d honeyforge_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install locked dependencies
        run: |
          python -m pip install uv==0.11.28
          uv sync --frozen
      - name: Lint and formatting
        run: |
          uv run --frozen ruff check . ../scripts
          uv run --frozen ruff format --check . ../scripts
      - name: Type checking
        run: uv run --frozen mypy
      - name: Migration upgrade, downgrade and model consistency
        run: |
          uv run --frozen alembic upgrade head
          uv run --frozen alembic check
          uv run --frozen alembic downgrade base
          uv run --frozen alembic upgrade head
      - name: Verify generated OpenAPI
        run: uv run --frozen python -m honeyforge.cli export-openapi --check
      - name: Integration and contract tests on PostgreSQL
        run: uv run --frozen pytest --junitxml=test-results.xml
      - name: Build runtime image
        run: >-
          docker build
          --build-arg PYTHON_IMAGE=public.ecr.aws/docker/library/python:3.12-slim
          --tag honeyforge-control:ci .

  telemetry:
    name: Agent telemetry checks
    needs: repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install agent dependencies
        run: |
          python -m pip install uv==0.11.28
          uv sync --frozen
      - name: Validate agent telemetry
        run: |
          uv run --frozen ruff check agent tests/telemetry
          uv run --frozen ruff format --check agent tests/telemetry
          uv run --frozen mypy
          # Win32 API проверяем отдельно, даже когда CI выполняется на Linux.
          uv run --frozen mypy --platform win32
          uv run --frozen pytest
          uv run --frozen python -m agent.telemetry.export_contracts --check
          uv run --frozen python -m agent.telemetry.demo

  runtime:
    name: Runtime checks
    needs: repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install agent dependencies
        run: |
          python -m pip install uv==0.11.28
          uv sync --frozen
      - name: Validate runtime
        run: |
          uv run --frozen ruff check agent honeypots infra tests
          uv run --frozen ruff format --check agent honeypots infra tests
          uv run --frozen mypy
          uv run --frozen pytest tests --ignore=tests/telemetry
          uv build --wheel
      - name: Validate runtime Compose configuration
        run: docker compose -f compose.runtime.yml config --quiet

  result:
    name: CI result
    needs: [repository, frontend, e2e, backend, telemetry, runtime]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Verify all required checks passed
        env:
          REPOSITORY_RESULT: ${{ needs.repository.result }}
          BACKEND_RESULT: ${{ needs.backend.result }}
          TELEMETRY_RESULT: ${{ needs.telemetry.result }}
          RUNTIME_RESULT: ${{ needs.runtime.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          E2E_RESULT: ${{ needs.e2e.result }}
          FRONTEND_PRESENT: ${{ needs.repository.outputs.frontend }}
        run: |
          test "$REPOSITORY_RESULT" = success
          test "$BACKEND_RESULT" = success
          test "$TELEMETRY_RESULT" = success
          test "$RUNTIME_RESULT" = success
          if [ "$FRONTEND_PRESENT" = true ]; then
            test "$FRONTEND_RESULT" = success
            test "$E2E_RESULT" = success
          elif [ "$FRONTEND_PRESENT" = false ]; then
            test "$FRONTEND_RESULT" = skipped
            test "$E2E_RESULT" = skipped
          else
            echo "::error::Component detection did not complete."
            exit 1
          fi
          echo "All required CI checks passed."
