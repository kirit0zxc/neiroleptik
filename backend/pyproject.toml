[project]
name = "honeyforge-control"
version = "0.1.0"
description = "Центр управления HoneyForge"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "pydantic-settings>=2.7,<3",
  "sqlalchemy>=2.0,<2.1", "psycopg[binary]>=3.2,<4", "alembic>=1.14,<2",
  "argon2-cffi>=23.1,<26", "cryptography>=44,<47",
  "jsonschema>=4.23,<5",
]
[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.11,<1", "mypy>=1.15,<2", "jsonschema>=4.23,<5", "honeyforge-agent", "websockets==15.0.1"]
[tool.uv.sources]
# Только стенд импортирует реальные Event/spool/sender; рабочий backend не зависит от agent.
honeyforge-agent = { path = "..", editable = true }
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/honeyforge"]
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
[tool.ruff]
target-version = "py312"
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
[tool.ruff.lint.per-file-ignores]
"src/honeyforge/api/*.py" = ["B008"]
[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["src/honeyforge"]
