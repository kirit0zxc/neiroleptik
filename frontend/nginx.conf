# Один origin для cookie-сессии, REST и живого WebSocket.
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

# Docker может сменить IP API после пересоздания контейнера.
upstream control_api {
    zone control_api 64k;
    resolver 127.0.0.11 valid=10s ipv6=off;
    server api:8000 resolve;
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 2m;

    location /api/ {
        proxy_pass http://control_api;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 90s;
        proxy_buffering off;
    }

    location = /readyz {
        proxy_pass http://control_api/readyz;
    }

    # После обновления сборки браузер получает актуальные имена chunks.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
