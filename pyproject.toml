[project]
name = "honeyforge-agent"
version = "0.1.0"
description = "Локальная телеметрия агента HoneyForge"
requires-python = ">=3.12,<3.13"
dependencies = ["pydantic==2.14.0"]

[dependency-groups]
dev = ["pytest==9.1.1", "ruff==0.16.10", "mypy==1.20.2", "jsonschema==4.26.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent"]

[tool.pytest.ini_options]
testpaths = ["tests/telemetry"]
addopts = "-ra --strict-markers"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["agent"]
