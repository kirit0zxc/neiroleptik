# Черновик точных схем экранов расследования (frontend → участник 4, backend).
# Статус: PROPOSAL. Не контракт и не генерируемый contracts/openapi.json:
# сверяем с backend перед публикацией. Основа — specs/frontend-dto-proposal.md
# (состав согласован 10–11.10.2026). Моков по этому файлу frontend не делает,
# пока схемы не утверждены.
openapi: 3.1.0
info:
  title: HoneyForge — расследование (proposal)
  version: 0.1.0-proposal
  x-status: proposal
  description: |
    Общие правила (как в specs/frontend-protocol-v1.md):

    * Время — RFC 3339 в UTC (`2026-10-11T09:41:12Z`). Идентификаторы — UUID строкой
      в нижнем регистре.
    * Доступ — cookie-сессия `hf_session`, роли admin/operator/viewer читают всё
      ниже. Чтение — GET без CSRF; единственный POST — `/events/lookup`: без побочных
      эффектов, но с CSRF и проверкой Origin, как изменяющие запросы в
      contracts/openapi.json (заголовок `X-CSRF-Token`; отказ — 403).
    * Ошибки — `ErrorResponse` (`detail` строка или список `ValidationIssue`,
      необязательный машинный `code`), как в contracts/openapi.json.
    * Списки — `{items, next_cursor}`. `limit` 1..200, по умолчанию 50.
      `next_cursor: null` — страниц больше нет.
    * Курсор непрозрачный и подписанный; frontend его не разбирает. Он
      связан с фильтрами и сортировкой и несёт границу следующей страницы по
      ключу сортировки. Для событий он несёт ещё и снимок (watermark, см.
      «Снимок» ниже); у артефактов, токенов и алертов — свои правила в
      описании ручек. Курсор с другими фильтрами
      или сортировкой, испорченный или устаревший (если примем срок жизни) — 422 с
      `code: INVALID_CURSOR`. Frontend перечитывает с первой страницы один
      раз; повторный 422 — ошибка на экране.
    * Порядок внутри страницы стабилен: последним ключом всегда идёт
      уникальная пара/идентификатор.
    * Данные атакующего — только строки; frontend выводит их текстом (S1, S2).
      Пароли не передаются (S4: `data.password_present` вместо `data.password`).
    * Каждый вывод (алерт, срабатывание токена, артефакт) ссылается на
      исходные события `event_refs`.

    Открытые вопросы помечены `x-question`.

    Дополнения после ревью (до сверки с backend):

    * **Коды ошибок.** Формат `^[A-Z][A-Z0-9_]*$`. Новые коды этого черновика:
      `INVALID_CURSOR` (422, закрепить — согласовано с участником 4 11.10;
      сервер пока отвечает курсорным 422 без кода), `ARTIFACT_PENDING`,
      `ARTIFACT_FAILED` (409), `ARTIFACT_EXPIRED` (410). Сброс курсора и
      перечитывание с первой страницы — только при `code: INVALID_CURSOR`;
      ошибки фильтров сброс не запускают. До появления кода на сервере frontend
      сохраняет нынешнее поведение: фильтры проверяются до запроса, а 422 на
      следующей странице (фильтры те же, что у успешной первой) считается
      курсорным: перечитывание с первой страницы автоматически один раз;
      повторный 422 (до успешной страницы или смены фильтров) — ошибка с
      «Повторить», показанные live-события и очередь паузы сохраняются.
      Основные фильтры (IP, from < to) проверяются до запроса.
      TODO: когда сервер начнёт отдавать `INVALID_CURSOR`, обновить
      specs/frontend.md (лента событий) и EventsPage — сброс только по коду.
    * **Пагинация.** Списки control (`/audit`, `/profiles`, ...) остаются на
      `limit` 1..100 + `offset` и ответе-массиве; телеметрия и расследование —
      курсор, `limit` 1..200 и конверт `{items, next_cursor}`, как `/events`.
      Различие осознанное: курсор нужен там, где данные растут во время чтения.
    * **Снимок (только события: `/events`, timeline).** Курсор несёт watermark
      `W` и границу следующей страницы по ключу сортировки. `W` — номер
      последнего опубликованного события (`stream_seq`, как у потока), а не
      время.
      Все страницы читают только записи с `stream_seq <= W` независимо от
      `sort`, в том числе timeline по `occurred_at` (закреплено с участником 4,
      11.10). На артефакты, токены и алерты эта гарантия не распространяется.
      Опоздавшее событие (offline-доставка) не появляется внутри уже прочитанных
      страниц — его покажет живой поток или новый первый запрос. Срок жизни курсора
      24 ч — пока предложение (`x-added`), на сервере его нет. Если примем:
      срок считается от создания снимка (первой страницы) и не продлевается
      следующими страницами; старше — 422 `INVALID_CURSOR`.
    * **`x-added`** — поле или параметр, которого нет в согласованном составе
      (specs/frontend-dto-proposal.md); предлагает frontend, решает backend.
    * **Ссылки `event_refs`** могут указывать на недоступное событие (не всегда
      из-за срока хранения): frontend пишет «событие недоступно», а не ошибку.
      Исходные события по ссылкам читаются отдельной выборкой
      `POST /api/v1/events/lookup` (до 100 пар), не пагинацией истории.
    * **Усечение ссылок.** Где `event_refs` ограничен 100, рядом обязательный
      `event_refs_truncated`: по одному `count` полноту списка не определить.
  x-question:
  - 'source=null: направление поддержано участником 4, но схема EventV1 требует объект — нужно согласованно
    обновить агентский и публичный контракты, backend и тесты. До этого — proposal.'
  - Принимаем ли срок жизни курсора 24 ч (отсчёт от создания снимка)?
  x-not-agreed: 'Сводка несогласованного (вопросы — у соответствующих ручек): скачивание для viewer, source=null,
    виды токенов, состав IoC, группировка алертов, умолчания from/to у CSV.'
servers:
- url: /
security:
- APIKeyCookie: []
paths:
  /api/v1/sessions/{session_id}:
    get:
      operationId: getSession
      summary: Паспорт сессии (F14)
      parameters:
      - $ref: '#/components/parameters/SessionId'
      responses:
        '200':
          description: Паспорт сессии.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionRead'
              examples:
                ssh:
                  $ref: '#/components/examples/SessionSsh'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/v1/events:
    get:
      operationId: listEvents
      summary: История событий и timeline сессии (F11, F14)
      description: |
        Существующая ручка истории (protocol v1) с двумя новыми параметрами:
        `session_id` и `sort`. По умолчанию — нынешний порядок истории
        `received_at DESC, event_id DESC, agent_id DESC`. Timeline сессии —
        `session_id=<id>&sort=occurred_at&order=asc`: порядок
        `occurred_at ASC, event_id ASC, agent_id ASC` (время события, а не
        приёма — после offline-доставки они расходятся). Курсор связан с
        `sort`/`order` и фильтрами.
        Допустимы только две комбинации: `sort=received_at&order=desc` (история) и `sort=occurred_at&order=asc` (timeline); остальные — 422. Для timeline нужен индекс `(session_id, occurred_at, event_id, agent_id)`.
      parameters:
      - name: deployment_id
        in: query
        schema:
          type: string
          format: uuid
      - name: session_id
        in: query
        schema:
          type: string
          format: uuid
        description: Новый фильтр.
        x-added: true
      - name: type
        in: query
        schema:
          type: string
          description: Тип EventV1 (enum в contracts/event-v1.schema.json).
      - name: source_ip
        in: query
        schema:
          type: string
        description: IPv4/IPv6; событие без source не подходит.
      - name: from
        in: query
        schema:
          type: string
          format: date-time
        description: Включительно, по occurred_at.
      - name: to
        in: query
        schema:
          type: string
          format: date-time
        description: Исключительно; from >= to — 422.
      - name: sort
        in: query
        description: Новый параметр. Поле сортировки.
        schema:
          type: string
          enum:
          - received_at
          - occurred_at
          default: received_at
        x-added: true
      - name: order
        in: query
        schema:
          type: string
          enum:
          - asc
          - desc
          default: desc
        x-added: true
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Страница событий.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - items
                - next_cursor
                properties:
                  items:
                    type: array
                    items:
                      $ref: ../contracts/event-v1.schema.json
                  next_cursor:
                    $ref: '#/components/schemas/NextCursor'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/InvalidCursorOrFilters'
  /api/v1/artifacts:
    get:
      operationId: listArtifacts
      summary: Артефакты (F16)
      description: |
        Порядок — `observed_at DESC, id DESC`.

        Пагинация без снимка: курсор несёт только границу следующей страницы по
        (`observed_at`, `id`); оба поля не меняются, поэтому одна запись не попадёт
        на две страницы. Записи с ключом новее границы на следующих страницах не
        появятся. Запоздавший артефакт (`observed_at` старше границы) может
        появиться на ещё не прочитанной странице. Изменяемый `state` может вывести
        запись из фильтра `state` или ввести в него между страницами. Для MVP такая
        неполнота допустима; свежую выборку даёт новый запрос первой страницы.
      parameters:
      - name: session_id
        in: query
        schema:
          type: string
          format: uuid
      - name: deployment_id
        in: query
        schema:
          type: string
          format: uuid
      - name: state
        in: query
        schema:
          $ref: '#/components/schemas/ArtifactState'
        x-added: true
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Страница артефактов.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - items
                - next_cursor
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/ArtifactRead'
                  next_cursor:
                    $ref: '#/components/schemas/NextCursor'
              examples:
                page:
                  $ref: '#/components/examples/ArtifactPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/InvalidCursorOrFilters'
  /api/v1/artifacts/{artifact_id}:
    get:
      operationId: getArtifact
      summary: Артефакт (F16)
      parameters:
      - $ref: '#/components/parameters/ArtifactId'
      responses:
        '200':
          description: Метаданные артефакта.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArtifactRead'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/v1/artifacts/{artifact_id}/content:
    get:
      operationId: downloadArtifact
      summary: Скачивание артефакта (F16, S5)
      description: |
        Только `state=available`. Ответ — вложение, frontend не открывает
        содержимое в браузере. 410 здесь — «файл недоступен (истёк)», не
        пересинхронизация потока.

        Заголовки ответа: `Content-Type: application/octet-stream` всегда (не `mime`
        артефакта), `Content-Length` = `size_bytes`, `ETag: "sha256:<sha256>"`,
        `Cache-Control: no-store`, `X-Content-Type-Options: nosniff`,
        `Content-Security-Policy: sandbox`, `Accept-Ranges: none` (Range не
        поддерживается). Имя файла формирует сервер: `filename` — ASCII, символы вне
        `[A-Za-z0-9._-]` заменяются на `_`, до 100 символов; плюс
        `filename*=UTF-8''<percent-encoded исходное имя>`.
      parameters:
      - $ref: '#/components/parameters/ArtifactId'
      responses:
        '200':
          description: Содержимое файла.
          headers:
            Content-Disposition:
              schema:
                type: string
              description: attachment; filename="x.sh"; filename*=UTF-8''x.sh
            Content-Type:
              schema:
                type: string
                enum:
                - application/octet-stream
            Content-Length:
              schema:
                type: integer
            ETag:
              schema:
                type: string
              description: '"sha256:<sha256>"'
            Cache-Control:
              schema:
                type: string
                enum:
                - no-store
            X-Content-Type-Options:
              schema:
                type: string
                enum:
                - nosniff
            Content-Security-Policy:
              schema:
                type: string
                enum:
                - sandbox
            Accept-Ranges:
              schema:
                type: string
                enum:
                - none
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Файл ещё не готов (`pending`) или не получен (`failed`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                pending:
                  value:
                    detail: Файл ещё проверяется
                    code: ARTIFACT_PENDING
                failed:
                  value:
                    detail: Файл не удалось получить
                    code: ARTIFACT_FAILED
        '410':
          description: Срок хранения истёк (`expired`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                detail: Файл удалён по сроку хранения
                code: ARTIFACT_EXPIRED
        '422':
          $ref: '#/components/responses/ValidationError'
      x-question: 'Доступ viewer к скачиванию не утверждён: решение владельца/backend; после решения фиксируем
        403 для неразрешённых ролей.'
  /api/v1/honeytokens:
    get:
      operationId: listHoneytokens
      summary: Медовые токены (F17)
      description: |
        Порядок — `created_at DESC, id DESC`. Секретное значение токена не возвращается.

        Пагинация без снимка: курсор несёт только границу следующей страницы по
        (`created_at`, `id`). `created_at` ставит сервер, поля ключа не меняются:
        новые токены появляются только перед первой страницей, одна запись не
        попадёт на две страницы. Фильтр — только по неизменяемому `deployment_id`,
        поэтому неполноты из-за изменения полей нет.
      parameters:
      - name: deployment_id
        in: query
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Страница токенов.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - items
                - next_cursor
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/HoneytokenRead'
                  next_cursor:
                    $ref: '#/components/schemas/NextCursor'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/InvalidCursorOrFilters'
  /api/v1/honeytokens/{honeytoken_id}/triggers:
    get:
      operationId: listHoneytokenTriggers
      summary: Срабатывания токена (F17)
      description: 'По событиям `token.triggered`: одно событие — одно срабатывание, `event_refs` ровно
        из одного элемента. `at` = `occurred_at` события. Порядок — `at DESC, agent_id DESC, event_id
        DESC`. Токен есть, срабатываний нет — пустой список; токена нет — 404.'
      parameters:
      - name: honeytoken_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Страница срабатываний.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - items
                - next_cursor
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/HoneytokenTrigger'
                  next_cursor:
                    $ref: '#/components/schemas/NextCursor'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/InvalidCursorOrFilters'
  /api/v1/alerts:
    get:
      operationId: listAlerts
      summary: Алерты (F17), только чтение в MVP
      description: |
        Порядок — `created_at DESC, id DESC`. Отдельного WS-сообщения нет: экраны
        опрашивают список и сводку раз в 15 с. Смена состояния — после MVP.

        Пагинация без снимка (уточнено с участником 4, 11.10): курсор несёт только
        границу следующей страницы по (`created_at`, `id`); `created_at` и `id`
        не меняются, поэтому одна запись не попадёт на две страницы. Но изменяемые
        поля (`state`, `severity`, `count`, `event_refs`) могут меняться между
        страницами, и алерт может перестать соответствовать фильтру `state` или
        `severity` либо начать соответствовать ему. Для MVP такая неполнота
        допустима: свежую выборку даёт новый запрос первой страницы. Frontend не
        сравнивает страницы между собой и при опросе заменяет алерт по `id`.
        Одного `version`/`updated_at` в курсоре для настоящего снимка недостаточно.
      parameters:
      - name: state
        in: query
        schema:
          $ref: '#/components/schemas/AlertState'
      - name: severity
        in: query
        schema:
          $ref: '#/components/schemas/Severity'
      - name: deployment_id
        in: query
        schema:
          type: string
          format: uuid
        x-added: true
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Страница алертов.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - items
                - next_cursor
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/AlertRead'
                  next_cursor:
                    $ref: '#/components/schemas/NextCursor'
              examples:
                bruteforce:
                  $ref: '#/components/examples/AlertPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/InvalidCursorOrFilters'
  /api/v1/analytics/summary:
    get:
      operationId: getSummary
      summary: Сводка обзора
      description: |
        События и топ источников — по опубликованным событиям с `occurred_at`
        в `[as_of − 1 ч, as_of)`. События без source в топ не входят.
        `as_of` — время сервера в момент расчёта. `alerts_open` — только `state=open` (без acknowledged). Равные `count` в топе — по IP как `inet` по возрастанию (IPv4 раньше IPv6).
      responses:
        '200':
          description: Сводка.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SummaryRead'
              example:
                as_of: '2026-10-11T12:00:00Z'
                deployments:
                  total: 4
                  running: 3
                  failed: 1
                hosts:
                  total: 3
                  online: 2
                  offline: 1
                  revoked: 0
                events_last_hour: 128
                alerts_open: 1
                top_sources:
                - ip: 203.0.113.9
                  count: 40
                - ip: 198.51.100.7
                  count: 12
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/iocs.csv:
    get:
      operationId: exportIocs
      summary: Экспорт IoC (F18)
      description: |
        Файл формирует сервер. Одна строка на индикатор и событие-основание.
        Период — по `occurred_at`, `from` включительно, `to` исключительно:
        - оба не заданы — `to` = момент запроса, `from` = `to` минус 24 ч;
        - задан только `from` — `to` = момент запроса;
        - задан только `to` — `from` = `to` минус 24 ч;
        - `from` должен быть раньше `to`, период — не больше 31 дня, иначе 422
          (UI ограничивает выбор `from` теми же правилами);
        - строк не больше 100 000, иначе 422 с просьбой сузить период.

        Порядок строк — `occurred_at ASC, agent_id ASC, event_id ASC`.

        Формат: UTF-8 с BOM (иначе Excel ломает кириллицу), разделитель `,`, перевод
        строки CRLF, заголовок первой строкой. Паролей нет (S4).

        Защита от формул: к каждой строковой ячейке, которая начинается с `=`, `+`,
        `-`, `@`, TAB, CR или их полноширинных аналогов (`＝ ＋ － ＠`), спереди
        добавляется `'`. Затем по RFC 4180: поле с `,`, `"`, CR или LF берётся в
        кавычки, `"` внутри удваивается. Правило одинаково для всех ячеек, включая
        IPv6 и отрицательные числа.

        `indicator_type`: `ipv4`, `ipv6`, `url`, `sha256`, `username`, `user_agent`.
        Имя файла: `honeyforge-iocs-<YYYYMMDDTHHMMSSZ>.csv` по времени формирования
        (без `:` — допустимо в Windows).
      parameters:
      - name: from
        in: query
        schema:
          type: string
          format: date-time
      - name: to
        in: query
        schema:
          type: string
          format: date-time
      - name: deployment_id
        in: query
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: CSV.
          headers:
            Content-Disposition:
              schema:
                type: string
              description: attachment; filename="honeyforge-iocs-20261011T120000Z.csv"
          content:
            text/csv:
              schema:
                type: string
              example: "\uFEFFindicator_type,indicator_value,occurred_at,agent_id,event_id,deployment_id,session_id\r\
                \nipv4,203.0.113.9,2026-10-11T09:41:12Z,7d3b0c1e-0000-4000-8000-000000000002,1f2e3d4c-0000-4000-8000-000000000006,9a8c5f2d-0000-4000-8000-000000000003,5e5510aa-0000-4000-8000-000000000001\r\
                \nusername,'-root,2026-10-11T09:41:12Z,7d3b0c1e-0000-4000-8000-000000000002,1f2e3d4c-0000-4000-8000-000000000006,9a8c5f2d-0000-4000-8000-000000000003,5e5510aa-0000-4000-8000-000000000001\r\
                \n"
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
      x-added: Параметры from/to/deployment_id, пределы, порядок строк и формат имени.
      x-question: 'Значения по умолчанию from/to (сейчас предложено: последние 24 ч) и полный список indicator_type.'
  /api/v1/events/lookup:
    post:
      operationId: lookupEvents
      summary: Исходные события по ссылкам (F17)
      x-added: Маршрут и формат подтверждены участником 4 (11.10).
      description: |
        Отдельно от пагинации истории. До 100 пар `{agent_id, event_id}`, без дублей (дубли — 422; frontend дедуплицирует сам). Доступна ролям admin/operator/viewer. POST — потому что список не помещается в query; побочных эффектов нет, CSRF и Origin проверяются как у изменяющих запросов.

        Каждая ссылка запроса попадает ровно в один список: `items` (в порядке соответствующих `refs`, без недоступных) или `unavailable` (тоже в порядке `refs`). В `items` — публичный EventV1 с той же маскировкой, что в REST и WS (S4: `data.password_present` вместо пароля). Неизвестный `agent_id`/`event_id` — в `unavailable`, не 404. Сопоставление `items` со ссылками — по `agent_id` и `event_id` внутри EventV1. Причина недоступности не раскрывается; frontend пишет «событие недоступно».
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - refs
              properties:
                refs:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items:
                    $ref: '#/components/schemas/EventRef'
                  uniqueItems: true
      responses:
        '200':
          description: Найденные и недоступные события.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - items
                - unavailable
                properties:
                  items:
                    type: array
                    items:
                      $ref: ../contracts/event-v1.schema.json
                  unavailable:
                    type: array
                    items:
                      $ref: '#/components/schemas/EventRef'
                    description: Frontend пишет «событие недоступно».
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
        '403':
          description: Неверный CSRF-токен или Origin.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                detail: CSRF-токен отсутствует или неверен
      parameters:
      - name: X-CSRF-Token
        in: header
        required: true
        schema:
          type: string
components:
  securitySchemes:
    APIKeyCookie:
      type: apiKey
      in: cookie
      name: hf_session
  parameters:
    SessionId:
      name: session_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ArtifactId:
      name: artifact_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Cursor:
      name: cursor
      in: query
      description: Непрозрачный курсор из `next_cursor`; связан с фильтрами и сортировкой, для событий
        — ещё и со снимком (watermark).
      schema:
        type: string
        maxLength: 1024
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
  responses:
    Unauthorized:
      description: Нет сессии или она истекла.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            detail: Требуется вход
    NotFound:
      description: Объекта нет.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            detail: Не найдено
    ValidationError:
      description: Неверные параметры.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InvalidCursorOrFilters:
      description: |
        Неверные фильтры (`from >= to`, неверный IP) — `detail` списком;
        несовместимый/устаревший курсор — `code: INVALID_CURSOR`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            cursor:
              value:
                detail: Курсор не соответствует фильтрам или сортировке
                code: INVALID_CURSOR
            filters:
              value:
                detail:
                - loc:
                  - query
                  - to
                  type: value_error
                  msg: to должен быть позже from
  schemas:
    ErrorResponse:
      description: Как в contracts/openapi.json.
      type: object
      additionalProperties: false
      required:
      - detail
      properties:
        detail:
          anyOf:
          - type: string
          - type: array
            items:
              $ref: '#/components/schemas/ValidationIssue'
        code:
          type:
          - string
          - 'null'
    ValidationIssue:
      type: object
      additionalProperties: false
      required:
      - loc
      - type
      - msg
      properties:
        loc:
          type: array
          items:
            anyOf:
            - type: string
            - type: integer
        type:
          type: string
        msg:
          type: string
    NextCursor:
      type:
      - string
      - 'null'
      description: '`null` — страниц больше нет.'
    EventRef:
      description: Пара, по которой событие уникально.
      type: object
      additionalProperties: false
      required:
