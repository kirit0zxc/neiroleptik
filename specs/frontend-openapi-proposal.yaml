# Черновик точных схем экранов расследования (frontend → участник 4, backend).
# Статус: PROPOSAL. Не контракт и не генерируемый contracts/openapi.json:
# сверяем с backend перед публикацией. Основа — specs/frontend-dto-proposal.md
# (состав согласован 10–11.10.2026). Моков по этому файлу frontend не делает,
# пока схемы не утверждены.
openapi: 3.1.0
info:
  title: HoneyForge — расследование (proposal)
  version: 0.1.0-proposal
  x-status: proposal
  description: |
    Общие правила (как в specs/frontend-protocol-v1.md):

    * Время — RFC 3339 в UTC (`2026-10-11T09:41:12Z`). Идентификаторы — UUID строкой
      в нижнем регистре.
    * Доступ — cookie-сессия `hf_session`, роли admin/operator/viewer читают всё
      ниже. Все ручки — GET, CSRF не нужен.
    * Ошибки — `ErrorResponse` (`detail` строка или список `ValidationIssue`,
      необязательный машинный `code`), как в contracts/openapi.json.
    * Списки — `{items, next_cursor}`. `limit` 1..200, по умолчанию 50.
      `next_cursor: null` — страниц больше нет.
    * Курсор непрозрачный и подписанный; frontend его не разбирает. Он
      связан с фильтрами, сортировкой и снимком: первая страница фиксирует
      снимок (границу по ключу сортировки), следующие страницы читают тот же
      снимок, новые поступления его не сдвигают. Курсор с другими фильтрами
      или сортировкой, испорченный или устаревший — 422 с
      `code: INVALID_CURSOR`. Frontend перечитывает с первой страницы один
      раз; повторный 422 — ошибка на экране.
    * Порядок внутри страницы стабилен: последним ключом всегда идёт
      уникальная пара/идентификатор.
    * Данные атакующего — только строки; frontend выводит их текстом (S1, S2).
      Пароли не передаются (S4: `data.password_present` вместо `data.password`).
    * Каждый вывод (алерт, срабатывание токена, артефакт) ссылается на
      исходные события `event_refs`.

    Открытые вопросы помечены `x-question`.
servers:
  - url: /
security:
  - APIKeyCookie: []

paths:
  /api/v1/sessions/{session_id}:
    get:
      operationId: getSession
      summary: Паспорт сессии (F14)
      parameters:
        - $ref: '#/components/parameters/SessionId'
      responses:
        '200':
          description: Паспорт сессии.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionRead' }
              examples:
                ssh:
                  $ref: '#/components/examples/SessionSsh'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /api/v1/events:
    get:
      operationId: listEvents
      summary: История событий и timeline сессии (F11, F14)
      description: |
        Существующая ручка истории (protocol v1) с двумя новыми параметрами:
        `session_id` и `sort`. По умолчанию — нынешний порядок истории
        `received_at DESC, event_id DESC, agent_id DESC`. Timeline сессии —
        `session_id=<id>&sort=occurred_at&order=asc`: порядок
        `occurred_at ASC, event_id ASC, agent_id ASC` (время события, а не
        приёма — после offline-доставки они расходятся). Курсор связан с
        `sort`/`order` и фильтрами.
      parameters:
        - { name: deployment_id, in: query, schema: { type: string, format: uuid } }
        - { name: session_id, in: query, schema: { type: string, format: uuid }, description: 'Новый фильтр.' }
        - { name: type, in: query, schema: { type: string } }
        - { name: source_ip, in: query, schema: { type: string }, description: 'IPv4/IPv6; событие без source не подходит.' }
        - { name: from, in: query, schema: { type: string, format: date-time }, description: 'Включительно, по occurred_at.' }
        - { name: to, in: query, schema: { type: string, format: date-time }, description: 'Исключительно; from >= to — 422.' }
        - name: sort
          in: query
          description: Новый параметр. Поле сортировки.
          schema: { type: string, enum: [received_at, occurred_at], default: received_at }
        - name: order
          in: query
          schema: { type: string, enum: [asc, desc], default: desc }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Страница событий.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items, next_cursor]
                properties:
                  items:
                    type: array
                    items: { $ref: '../contracts/event-v1.schema.json' }
                  next_cursor: { $ref: '#/components/schemas/NextCursor' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/InvalidCursorOrFilters' }

  /api/v1/artifacts:
    get:
      operationId: listArtifacts
      summary: Артефакты (F16)
      description: Порядок — `observed_at DESC, id DESC`.
      parameters:
        - { name: session_id, in: query, schema: { type: string, format: uuid } }
        - { name: deployment_id, in: query, schema: { type: string, format: uuid } }
        - name: state
          in: query
          schema: { $ref: '#/components/schemas/ArtifactState' }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Страница артефактов.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items, next_cursor]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/ArtifactRead' } }
                  next_cursor: { $ref: '#/components/schemas/NextCursor' }
              examples:
                page:
                  $ref: '#/components/examples/ArtifactPage'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/InvalidCursorOrFilters' }

  /api/v1/artifacts/{artifact_id}:
    get:
      operationId: getArtifact
      summary: Артефакт (F16)
      parameters:
        - $ref: '#/components/parameters/ArtifactId'
      responses:
        '200':
          description: Метаданные артефакта.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ArtifactRead' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/artifacts/{artifact_id}/content:
    get:
      operationId: downloadArtifact
      summary: Скачивание артефакта (F16, S5)
      description: |
        Только `state=available`. Ответ — вложение, frontend не открывает
        содержимое в браузере. 410 здесь — «файл недоступен (истёк)», не
        пересинхронизация потока.
      parameters:
        - $ref: '#/components/parameters/ArtifactId'
      responses:
        '200':
          description: Содержимое файла.
          headers:
            Content-Disposition:
              schema: { type: string }
              description: 'attachment; filename="<безопасное имя>"'
            X-Content-Type-Options:
              schema: { type: string, enum: [nosniff] }
            Content-Length:
              schema: { type: integer }
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Файл ещё не готов (`pending`) или не получен (`failed`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example: { detail: 'Файл ещё проверяется', code: ARTIFACT_PENDING }
        '410':
          description: Срок хранения истёк (`expired`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example: { detail: 'Файл удалён по сроку хранения', code: ARTIFACT_EXPIRED }

  /api/v1/honeytokens:
    get:
      operationId: listHoneytokens
      summary: Медовые токены (F17)
      description: Порядок — `created_at DESC, id DESC`. Секретное значение токена не возвращается.
      parameters:
        - { name: deployment_id, in: query, schema: { type: string, format: uuid } }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Страница токенов.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items, next_cursor]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/HoneytokenRead' } }
                  next_cursor: { $ref: '#/components/schemas/NextCursor' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/InvalidCursorOrFilters' }

  /api/v1/honeytokens/{honeytoken_id}/triggers:
    get:
      operationId: listHoneytokenTriggers
      summary: Срабатывания токена (F17)
      description: По событиям `token.triggered`. Порядок — `at DESC`, затем пара события.
      parameters:
        - name: honeytoken_id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Страница срабатываний.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items, next_cursor]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/HoneytokenTrigger' } }
                  next_cursor: { $ref: '#/components/schemas/NextCursor' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/InvalidCursorOrFilters' }

  /api/v1/alerts:
    get:
      operationId: listAlerts
      summary: Алерты (F17), только чтение в MVP
      description: |
        Порядок — `created_at DESC, id DESC`. Отдельного WS-сообщения нет:
        экраны опрашивают список и сводку раз в 15 с. Смена состояния — после MVP.
      parameters:
        - name: state
          in: query
          schema: { $ref: '#/components/schemas/AlertState' }
        - name: severity
          in: query
          schema: { $ref: '#/components/schemas/Severity' }
        - { name: deployment_id, in: query, schema: { type: string, format: uuid } }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Страница алертов.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items, next_cursor]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/AlertRead' } }
                  next_cursor: { $ref: '#/components/schemas/NextCursor' }
              examples:
                bruteforce:
                  $ref: '#/components/examples/AlertPage'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/InvalidCursorOrFilters' }

  /api/v1/analytics/summary:
    get:
      operationId: getSummary
      summary: Сводка обзора
      description: |
        События и топ источников — по опубликованным событиям с `occurred_at`
        в `[as_of − 1 ч, as_of)`. События без source в топ не входят.
      responses:
        '200':
          description: Сводка.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SummaryRead' }
              example:
                as_of: '2026-10-11T12:00:00Z'
                deployments: { total: 4, running: 3, failed: 1 }
                hosts: { total: 3, online: 2, offline: 1, revoked: 0 }
                events_last_hour: 128
                alerts_open: 1
                top_sources: [{ ip: 203.0.113.9, count: 40 }, { ip: 198.51.100.7, count: 12 }]
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/iocs.csv:
    get:
      operationId: exportIocs
      summary: Экспорт IoC (F18)
      description: |
        Файл формирует сервер. Одна строка на индикатор и событие-основание.
        Без паролей; значения, начинающиеся с `= + - @` или табуляции,
        экранируются (защита от формул CSV). Кодировка UTF-8, разделитель `,`,
        перевод строки CRLF, заголовок первой строкой.
      parameters:
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
        - { name: deployment_id, in: query, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: CSV.
          headers:
            Content-Disposition:
              schema: { type: string }
              description: 'attachment; filename="honeyforge-iocs-<from>-<to>.csv"'
          content:
            text/csv:
              schema: { type: string }
              example: |
                indicator_type,indicator_value,occurred_at,agent_id,event_id,deployment_id,session_id
                ipv4,203.0.113.9,2026-10-11T09:41:12Z,7d3b…,1f2e…,9a8c…,5e55…
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }

components:
  securitySchemes:
    APIKeyCookie: { type: apiKey, in: cookie, name: hf_session }

  parameters:
    SessionId:
      name: session_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    ArtifactId:
      name: artifact_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    Cursor:
      name: cursor
      in: query
      description: Непрозрачный курсор из `next_cursor`; связан с фильтрами, сортировкой и снимком.
      schema: { type: string, maxLength: 1024 }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }

  responses:
    Unauthorized:
      description: Нет сессии или она истекла.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example: { detail: 'Требуется вход' }
    NotFound:
      description: Объекта нет.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example: { detail: 'Не найдено' }
    ValidationError:
      description: Неверные параметры.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    InvalidCursorOrFilters:
      description: |
        Неверные фильтры (`from >= to`, неверный IP) — `detail` списком;
        несовместимый/устаревший курсор — `code: INVALID_CURSOR`.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          examples:
            cursor:
              value: { detail: 'Курсор не соответствует фильтрам или сортировке', code: INVALID_CURSOR }
            filters:
              value: { detail: [{ loc: [query, to], type: value_error, msg: 'to должен быть позже from' }] }

  schemas:
    ErrorResponse:
      description: Как в contracts/openapi.json.
      type: object
      additionalProperties: false
      required: [detail]
      properties:
        detail:
          anyOf:
            - { type: string }
            - { type: array, items: { $ref: '#/components/schemas/ValidationIssue' } }
        code: { type: [string, 'null'] }
    ValidationIssue:
      type: object
      additionalProperties: false
      required: [loc, type, msg]
      properties:
        loc: { type: array, items: { anyOf: [{ type: string }, { type: integer }] } }
        type: { type: string }
        msg: { type: string }

    NextCursor:
      type: [string, 'null']
      description: '`null` — страниц больше нет.'

    EventRef:
      description: Пара, по которой событие уникально.
      type: object
      additionalProperties: false
      required: [agent_id, event_id]
      properties:
        agent_id: { type: string, format: uuid }
        event_id: { type: string, format: uuid }
    EventRefs:
      type: array
      minItems: 1
      maxItems: 100
      items: { $ref: '#/components/schemas/EventRef' }
      x-question: 'Предел 100 и усечение: нужен ли флаг event_refs_truncated для длинных серий?'

    Endpoint:
      type: object
      additionalProperties: false
      required: [ip, port]
      properties:
        ip: { type: string, description: 'IPv4/IPv6' }
        port: { type: integer, minimum: 0, maximum: 65535 }
    Service:
      type: object
      additionalProperties: false
      required: [protocol, port]
      properties:
        protocol: { type: string, enum: [tcp, http, ssh] }
        port: { type: integer, minimum: 1, maximum: 65535 }

    SessionRead:
      type: object
      additionalProperties: false
      required: [session_id, agent_id, deployment_id, instance_id, protocol, source, service,
                 started_at, ended_at, auth, counts, replay, profile_revision]
      properties:
        session_id: { type: string, format: uuid }
        agent_id: { type: string, format: uuid }
        deployment_id: { type: string, format: uuid }
        instance_id: { type: string, format: uuid }
        protocol: { type: string, enum: [tcp, http, ssh] }
        source:
          description: 'null, если источник неизвестен (см. вопрос о source=null в EventV1).'
          anyOf: [{ $ref: '#/components/schemas/Endpoint' }, { type: 'null' }]
        service: { $ref: '#/components/schemas/Service' }
        started_at: { type: string, format: date-time }
        ended_at:
          type: [string, 'null']
          format: date-time
          description: 'null — окончание неизвестно (событие закрытия могло не дойти), а не «сессия идёт».'
        auth:
          type: object
          additionalProperties: false
          required: [attempts, succeeded, username]
          properties:
            attempts: { type: integer, minimum: 0 }
            succeeded: { type: boolean }
            username: { type: [string, 'null'], description: 'Логин успешного входа; паролей нет (S4).' }
        counts:
          description: По событиям, полученным центром.
          type: object
          additionalProperties: false
          required: [events, commands, artifacts, tokens_triggered]
          properties:
            events: { type: integer, minimum: 0 }
            commands: { type: integer, minimum: 0 }
            artifacts: { type: integer, minimum: 0 }
            tokens_triggered: { type: integer, minimum: 0 }
        replay:
          type: object
          additionalProperties: false
          required: [available, complete]
          properties:
            available: { type: boolean, description: 'Есть ли запись (GET /sessions/{id}/replay).' }
            complete: { type: boolean, description: 'Как complete в ответе replay.' }
        profile_revision: { type: integer, minimum: 1 }

    ArtifactState:
      type: string
      enum: [pending, available, failed, expired]
    ArtifactRead:
      type: object
      additionalProperties: false
      required: [id, session_id, deployment_id, state, name, source_url, size_bytes, sha256,
                 mime, observed_at, expires_at, error, event_refs]
      properties:
        id: { type: string, format: uuid }
        session_id: { type: [string, 'null'], format: uuid }
        deployment_id: { type: string, format: uuid }
        state: { $ref: '#/components/schemas/ArtifactState' }
        name: { type: string, maxLength: 255, description: 'Имя из данных атакующего — только текст.' }
        source_url: { type: [string, 'null'], maxLength: 2048, description: 'Не делается ссылкой (S3).' }
        size_bytes: { type: [integer, 'null'], minimum: 0, description: 'Обязателен при available.' }
        sha256: { type: [string, 'null'], pattern: '^[0-9a-f]{64}$', description: 'Обязателен при available.' }
        mime: { type: [string, 'null'], description: 'Определён сервером, а не заявлен атакующим.' }
        observed_at: { type: string, format: date-time }
        expires_at: { type: [string, 'null'], format: date-time }
        error: { type: [string, 'null'], description: 'Причина failed, для оператора.' }
        event_refs: { $ref: '#/components/schemas/EventRefs' }

    HoneytokenRead:
      type: object
      additionalProperties: false
      required: [id, deployment_id, kind, label, created_at, last_triggered_at, trigger_count]
      properties:
        id: { type: string, format: uuid }
        deployment_id: { type: string, format: uuid }
        kind: { type: string, enum: [credential, api_key, url, file], x-question: 'Нужны ли другие виды в MVP (сейчас — URL-токен)?' }
        label: { type: string, maxLength: 200, description: 'Описание для оператора, без секретного значения.' }
        created_at: { type: string, format: date-time }
        last_triggered_at: { type: [string, 'null'], format: date-time }
        trigger_count: { type: integer, minimum: 0 }
    HoneytokenTrigger:
      type: object
      additionalProperties: false
      required: [at, source, session_id, event_refs]
      properties:
        at: { type: string, format: date-time }
        source: { anyOf: [{ $ref: '#/components/schemas/Endpoint' }, { type: 'null' }] }
        session_id: { type: [string, 'null'], format: uuid, description: 'null: одного совпавшего IP недостаточно для привязки.' }
        event_refs: { $ref: '#/components/schemas/EventRefs' }

    AlertState: { type: string, enum: [open, acknowledged, resolved] }
    Severity: { type: string, enum: [low, medium, high, critical] }
    AlertRead:
      type: object
      additionalProperties: false
      required: [id, rule, rule_version, severity, state, title, window, count, deployment_id,
                 session_id, source_ip, created_at, updated_at, event_refs]
      properties:
        id: { type: string, format: uuid }
        rule: { type: string, examples: [auth.bruteforce] }
        rule_version: { type: integer, minimum: 1 }
        severity: { $ref: '#/components/schemas/Severity' }
        state: { $ref: '#/components/schemas/AlertState' }
        title: { type: string, maxLength: 200, description: 'Формирует сервер; frontend показывает текстом.' }
        window:
          type: object
          additionalProperties: false
          required: [from, to]
          properties:
            from: { type: string, format: date-time }
            to: { type: string, format: date-time }
        count: { type: integer, minimum: 1, description: 'Фактическое число событий в окне.' }
        deployment_id: { type: string, format: uuid }
        session_id: { type: [string, 'null'], format: uuid }
        source_ip: { type: [string, 'null'] }
