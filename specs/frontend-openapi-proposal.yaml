# Черновик схем расследования (frontend → участник 4, backend).
# Статус: PROPOSAL — только то, чего ещё нет в общем OpenAPI.
# Реализованное (PR #35, специфика — specs/investigation-handoff.md) берётся
# из contracts/openapi.json и contracts/event-v1.schema.json, здесь не дублируется.
# PR #35 уже включён в main; реализованные ручки описаны в общем контракте.
openapi: 3.1.0
info:
  title: HoneyForge — расследование (proposal, остаток)
  version: 0.2.0-proposal
  x-status: proposal
  description: |
    Синхронизировано с main после слияния PR #35.

    Что перенесено в общий контракт (PR #35, участник 4, 11.10.2026):
    `GET /api/v1/events` (session_id, sort/order: история received_at desc и
    timeline occurred_at asc), `POST /api/v1/events/lookup`, артефакты и их
    содержимое, медовые токены и срабатывания, алерты (чтение), `GET
    /api/v1/iocs.csv`. Источник типов для frontend — только `contracts/openapi.json`
    и `contracts/event-v1.schema.json`; семантика — specs/investigation-handoff.md
    и specs/investigation-mvp.md. Согласовано там же:

    * снимок событий — `stream_seq <= W` плюс граница следующей страницы; у
      артефактов, токенов и алертов — слабая гарантия, изменяемые поля могут
      обновляться между страницами;
    * курсор сбрасывается только по 422 `code: INVALID_CURSOR`, ошибка фильтров —
      обычный 422 без сброса;
    * права: читают все роли, содержимое артефакта скачивают только
      operator/admin (viewer — 403, кнопка скрыта);
    * `EventV1.source` обязателен и nullable; без source событие не подходит
      фильтру по IP и не создаёт IP-индикатор и алерт;
    * медовые токены — только `kind = "url"`; IoC — ipv4/ipv6/url/sha256;
      алерт `auth.bruteforce` (high, open, count >= 5);
    * CSV: `from` и `to` обязательны (без одного — 422), `from < to`, период
      не больше 31 дня, полуинтервал `[from, to)`, до 100 000 строк. Серверных
      умолчаний нет; «последние 24 часа» — выбор интерфейса по умолчанию,
      интерфейс явно отправляет обе даты.

    Остаются в этом файле:

    * паспорт сессии `GET /api/v1/sessions/{session_id}` — ручки нет;
    * сводка `GET /api/v1/analytics/summary` — HTTP-ручки нет.

    Общие правила этих двух ручек — как в общем контракте: время RFC 3339 UTC,
    UUID строкой, `ErrorResponse`, cookie-сессия `hf_session`.
  x-open-proposals:
  - Срок жизни курсора 24 ч (отсчёт от создания снимка, страницы не продлевают).
  - Расширенные виды медовых токенов, другие правила, состояния и severity алертов, acknowledge/resolve,
    скользящее окно алертов.
  - Полнота исторического снимка изменяемых сущностей.
  - x-added первой версии черновика в общий контракт не переносятся.
servers:
- url: /
security:
- APIKeyCookie: []
paths:
  /api/v1/sessions/{session_id}:
    get:
      operationId: getSession
      summary: Паспорт сессии (F14)
      parameters:
      - $ref: '#/components/parameters/SessionId'
      responses:
        '200':
          description: Паспорт сессии.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionRead'
              examples:
                ssh:
                  $ref: '#/components/examples/SessionSsh'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/v1/analytics/summary:
    get:
      operationId: getSummary
      summary: Сводка обзора
      description: |
        События и топ источников — по опубликованным событиям с `occurred_at`
        в `[as_of − 1 ч, as_of)`. События без source в топ не входят.
        `as_of` — время сервера в момент расчёта. `alerts_open` — только `state=open` (без acknowledged). Равные `count` в топе — по IP как `inet` по возрастанию (IPv4 раньше IPv6).
      responses:
        '200':
          description: Сводка.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SummaryRead'
              example:
                as_of: '2026-10-11T12:00:00Z'
                deployments:
                  total: 4
                  running: 3
                  failed: 1
                hosts:
                  total: 3
                  online: 2
                  offline: 1
                  revoked: 0
                events_last_hour: 128
                alerts_open: 1
                top_sources:
                - ip: 203.0.113.9
                  count: 40
                - ip: 198.51.100.7
                  count: 12
        '401':
          $ref: '#/components/responses/Unauthorized'
components:
  securitySchemes:
    APIKeyCookie:
      type: apiKey
      in: cookie
      name: hf_session
  parameters:
    SessionId:
      name: session_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    Unauthorized:
      description: Нет сессии или она истекла.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            detail: Требуется вход
    NotFound:
      description: Объекта нет.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            detail: Не найдено
    ValidationError:
      description: Неверные параметры.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    ErrorResponse:
      description: Как в contracts/openapi.json.
      type: object
      additionalProperties: false
      required:
      - detail
      properties:
        detail:
          anyOf:
          - type: string
          - type: array
            items:
              $ref: '#/components/schemas/ValidationIssue'
        code:
          type:
          - string
          - 'null'
    ValidationIssue:
      type: object
      additionalProperties: false
      required:
      - loc
      - type
      - msg
      properties:
        loc:
          type: array
          items:
            anyOf:
            - type: string
            - type: integer
        type:
          type: string
        msg:
          type: string
    Endpoint:
      type: object
      additionalProperties: false
      required:
      - ip
      - port
      properties:
        ip:
          type: string
          description: IPv4/IPv6
        port:
          type: integer
          minimum: 0
          maximum: 65535
    Service:
      type: object
      additionalProperties: false
      required:
      - protocol
      - port
      properties:
        protocol:
          type: string
          enum:
          - tcp
          - http
          - ssh
        port:
          type: integer
          minimum: 1
          maximum: 65535
    SessionRead:
      type: object
      additionalProperties: false
      required:
      - session_id
      - agent_id
      - deployment_id
      - instance_id
      - protocol
      - source
      - service
      - started_at
      - ended_at
      - auth
      - counts
      - replay
      - profile_revision
      properties:
        session_id:
          type: string
          format: uuid
        agent_id:
          type: string
          format: uuid
        deployment_id:
          type: string
          format: uuid
        instance_id:
          type: string
          format: uuid
        protocol:
          type: string
          enum:
          - tcp
          - http
          - ssh
        source:
          description: Обязательное nullable-поле, как EventV1.source в общем контракте.
          anyOf:
          - $ref: '#/components/schemas/Endpoint'
          - type: 'null'
        service:
          $ref: '#/components/schemas/Service'
        started_at:
          type: string
          format: date-time
          description: 'Та же база времени, что started_at в ответе replay: смещение события = occurred_at
            − started_at.'
        ended_at:
          type:
          - string
          - 'null'
          format: date-time
          description: null — окончание неизвестно (событие закрытия могло не дойти), а не «сессия идёт».
        auth:
          type: object
          additionalProperties: false
          required:
          - attempts
          - succeeded
          - username
          properties:
            attempts:
              type: integer
              minimum: 0
            succeeded:
              type: boolean
            username:
              type:
              - string
              - 'null'
              description: Логин успешного входа; паролей нет (S4).
        counts:
          description: По событиям, полученным центром.
          type: object
          additionalProperties: false
          required:
          - events
          - commands
          - artifacts
          - tokens_triggered
          properties:
            events:
              type: integer
              minimum: 0
            commands:
              type: integer
              minimum: 0
            artifacts:
              type: integer
              minimum: 0
            tokens_triggered:
              type: integer
              minimum: 0
        replay:
          type: object
          additionalProperties: false
          required:
          - available
          - complete
          properties:
            available:
              type: boolean
              description: Есть ли запись сессии. Ручки replay на сервере пока нет (handoff — нет полного session/replay); протокол — specs/frontend-protocol-v1.md, «Replay».
            complete:
              type: boolean
              description: Как complete в ответе replay.
        profile_revision:
          type: integer
          minimum: 1
      x-question: 'Способ расчёта (на лету или хранение) — внутреннее дело backend. Для frontend важны
        правила: counts — по событиям сессии, полученным центром на момент ответа; auth и ended_at — из
        тех же событий; ответ согласован внутри себя.'
    SummaryRead:
      type: object
      additionalProperties: false
      required:
      - as_of
      - deployments
      - hosts
      - events_last_hour
      - alerts_open
      - top_sources
      properties:
        as_of:
          type: string
          format: date-time
        deployments:
          type: object
          additionalProperties: false
          required:
          - total
          - running
          - failed
          properties:
            total:
              type: integer
              minimum: 0
            running:
              type: integer
              minimum: 0
            failed:
              type: integer
              minimum: 0
        hosts:
          type: object
          additionalProperties: false
          required:
          - total
          - online
          - offline
          - revoked
          properties:
            total:
              type: integer
              minimum: 0
            online:
              type: integer
              minimum: 0
            offline:
              type: integer
              minimum: 0
            revoked:
              type: integer
              minimum: 0
              description: Не входит в offline.
        events_last_hour:
          type: integer
          minimum: 0
        alerts_open:
          type: integer
          minimum: 0
        top_sources:
          type: array
          maxItems: 5
          description: Убывание count, при равенстве — IP по возрастанию.
          items:
            type: object
            additionalProperties: false
            required:
            - ip
            - count
            properties:
              ip:
                type: string
              count:
                type: integer
                minimum: 1
          x-added: maxItems 5 (топ-5 согласован, предел — предложение).
  examples:
    SessionSsh:
      value:
        session_id: 5e5510aa-0000-4000-8000-000000000001
        agent_id: 7d3b0c1e-0000-4000-8000-000000000002
        deployment_id: 9a8c5f2d-0000-4000-8000-000000000003
        instance_id: c0ffee00-0000-4000-8000-000000000004
        protocol: ssh
        source:
          ip: 203.0.113.9
          port: 40112
        service:
          protocol: ssh
          port: 2222
        started_at: '2026-10-11T09:41:12Z'
        ended_at: null
        auth:
          attempts: 3
          succeeded: true
          username: root
        counts:
          events: 41
          commands: 12
          artifacts: 1
          tokens_triggered: 0
        replay:
          available: true
          complete: false
        profile_revision: 4
